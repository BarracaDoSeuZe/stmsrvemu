name: Build and Release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-core:
    name: Build Core (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
          cache: "pip"
          cache-dependency-path: emulator/requirements.txt

      - name: Install dependencies
        working-directory: emulator
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Emulator
        working-directory: emulator
        run: >
          python -m PyInstaller -F -i source-content.ico emulator.py
          --add-data "steam3/protobufs;steam3/protobufs"
          --add-data "files/icons/*.ico;files/icons/"
          --hidden-import tkinter
          --paths .

      - name: Build Content Server
        working-directory: emulator
        run: >
          python -m PyInstaller -F -i source-content.ico content_server_launch.py
          --add-data "steam3/protobufs;steam3/protobufs"
          --add-data "files/icons/*.ico;files/icons/"
          --hidden-import tkinter
          --paths .

      - name: Tag artifacts with Python version
        working-directory: emulator/dist
        shell: pwsh
        run: |
          Rename-Item emulator.exe "emulator-py${{ matrix.python-version }}.exe"
          Rename-Item content_server_launch.exe "content_server-py${{ matrix.python-version }}.exe"

      - name: Upload Emulator artifact
        uses: actions/upload-artifact@v6
        with:
          name: emulator-py${{ matrix.python-version }}
          path: emulator/dist/emulator-py${{ matrix.python-version }}.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload Content Server artifact
        uses: actions/upload-artifact@v6
        with:
          name: contentserver-py${{ matrix.python-version }}
          path: emulator/dist/content_server-py${{ matrix.python-version }}.exe
          if-no-files-found: error
          retention-days: 14

  build-blobmanager:
    name: Build Blob Manager (Python 3.9)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"
          architecture: x64
          cache: "pip"
          cache-dependency-path: emulator/py39_tools/billysb_blob_manager/requirements.txt

      - name: Install dependencies
        working-directory: emulator/py39_tools/billysb_blob_manager
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Blob Manager
        working-directory: emulator/py39_tools/billysb_blob_manager
        run: >
          python -m PyInstaller --noconsole -F -i icon.ico
          --hidden-import=difflib --hidden-import=configparser --hidden-import=queue
          --hidden-import=itertools --hidden-import=webbrowser --hidden-import=urllib.request
          --hidden-import=urllib.error --hidden-import=urllib.parse --hidden-import=json
          --hidden-import=pydoc --hidden-import=ctypes --hidden-import=platform
          --add-data "resources;resources" blobmgr.py

      - uses: actions/upload-artifact@v6
        with:
          name: blobmgr-exe
          path: emulator/py39_tools/billysb_blob_manager/dist/blobmgr.exe
          if-no-files-found: error
          retention-days: 14

  build-tools:
    name: Build Admin Tools (Python 3.9)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"
          architecture: x64
          cache: "pip"
          cache-dependency-path: emulator/py39_tools/user_tool/requirements.txt

      - name: Install dependencies
        working-directory: emulator/py39_tools/user_tool
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller sqlalchemy pymysql

      - name: Build User Tool
        working-directory: emulator/py39_tools/user_tool
        run: >
          python -m PyInstaller -F -i ../../source-content.ico User_tool.py
          --add-data "base_dbdriver.py;."
          --hidden-import=sqlalchemy --hidden-import=pymysql --hidden-import=windows_curses
          --paths .

      - name: Build Remote Admin Tool
        working-directory: emulator/py39_tools/user_tool
        run: >
          python -m PyInstaller -F -i ../../source-content.ico remote_admintool.py
          --add-data "networking.py;." --add-data "local_utils.py;."
          --add-data "user_config.py;." --add-data "consolegui_utils.py;."
          --hidden-import=windows_curses --hidden-import=curses
          --paths .

      - uses: actions/upload-artifact@v6
        with:
          name: tools-exe
          path: |
            emulator/py39_tools/user_tool/dist/User_tool.exe
            emulator/py39_tools/user_tool/dist/remote_admintool.exe
          if-no-files-found: error
          retention-days: 14

  package:
    name: Package (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    needs: [build-core, build-blobmanager, build-tools]
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - name: Download core (emulator)
        uses: actions/download-artifact@v4
        with:
          name: emulator-py${{ matrix.python-version }}
          path: bundle

      - name: Download core (content server)
        uses: actions/download-artifact@v4
        with:
          name: contentserver-py${{ matrix.python-version }}
          path: bundle

      - name: Download blob manager
        uses: actions/download-artifact@v4
        with:
          name: blobmgr-exe
          path: bundle

      - name: Download admin tools
        uses: actions/download-artifact@v4
        with:
          name: tools-exe
          path: bundle

      - name: Upload full bundle
        uses: actions/upload-artifact@v6
        with:
          name: STMServerEmu-py${{ matrix.python-version }}
          path: bundle
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [package]
    permissions:
      contents: write
    steps:
      - name: Download all bundles
        uses: actions/download-artifact@v4
        with:
          pattern: STMServerEmu-py*
          path: release

      - name: Zip each bundle
        working-directory: release
        run: |
          for dir in */; do
            name="${dir%/}"
            (cd "$name" && zip -r "../${name}.zip" .)
          done

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          generate_release_notes: true